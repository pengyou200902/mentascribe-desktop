# Build configuration for whisper-rs CUDA support on Windows
# CUDA 12.9 nvcc doesn't support MSVC 19.50 (VS 18/2026) as host compiler.
# Workaround: use Ninja generator + VS 2022 Build Tools cl.exe as CUDA host compiler.
[target.x86_64-pc-windows-msvc]
rustflags = []

[env]
# Use Ninja instead of VS generator so CMAKE_CUDA_HOST_COMPILER is respected
CMAKE_GENERATOR = "Ninja"
# Point CUDA host compiler to VS 2022 Build Tools (MSVC 14.44, supported by CUDA 12.9)
CMAKE_CUDA_HOST_COMPILER = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\cl.exe"
# Tell CMake where to find Ninja (ships with VS 18)
CMAKE_MAKE_PROGRAM = "C:\\Program Files\\Microsoft Visual Studio\\18\\Community\\Common7\\IDE\\CommonExtensions\\Microsoft\\CMake\\Ninja\\ninja.exe"
